name: WinoWatt — мобильная браузерная регрессия
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Подготовить Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Проверить приложение в браузере на мобильных ширинах
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/winowatt-http.log 2>&1 &
          sleep 2
          node tests/browser-e2e.cjs
          node tests/keyboard-a11y.cjs
          node tests/full-learning-journey.cjs
