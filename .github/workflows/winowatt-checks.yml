name: WinoWatt — проверка учебного приложения
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверка синтаксиса и учебных данных
        run: |
          set -e
          for file in tests/*-smoke.cjs; do
            echo "Running $file"
            node "$file"
          done
          node tests/smoke.cjs