name: WinoWatt — проверка учебного приложения
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверка синтаксиса и учебных данных
        run: |
          set -e
          for file in tests/*-smoke.cjs; do
            echo "Running $file"
            node "$file"
          done
          node tests/smoke.cjs
          node tests/content-audit.cjs
          node tests/reverse-balance.cjs
          node tests/distractor-quality.cjs
          node tests/practice-quality.cjs
          node tests/beginner-path.cjs
          node tests/old-world-albarino-smoke.cjs
          python3 tools/build_release.py --version v0.0.0 --date 2026-01-01 --output dist/test-archive.zip
          python3 tools/verify_release.py dist/test-archive.zip